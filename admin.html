<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frais Kilométriques — Direction — AID'Aux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F3F5FA;
    --surface: #FFFFFF;
    --ink: #182449;
    --ink-soft: #5B6690;
    --navy: #1B2A6B;
    --navy-wash: #E8EAF6;
    --teal: #13B3B3;
    --teal-wash: #E1F6F5;
    --coral: #E8583A;
    --coral-wash: #FDEAE4;
    --line: #DDE1EF;
    --radius: 14px;
    --shadow: 0 1px 2px rgba(27,42,107,0.06), 0 8px 24px -12px rgba(27,42,107,0.20);
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family: var(--font-body); background: var(--bg); color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .app{ max-width: 720px; margin: 0 auto; padding: 0 0 60px; }
  .hero{
    background: linear-gradient(155deg, var(--navy), var(--teal) 75%);
    color: white; padding: 24px 20px 30px; border-radius: 0 0 22px 22px;
  }
  .hero h1{ font-family: var(--font-display); font-weight:700; font-size: 20px; margin:0 0 4px; }
  .hero p{ margin:0; font-size:13px; opacity:0.85; }
  .card{
    background: var(--surface); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 18px; margin: -18px 16px 16px; position: relative; z-index:2;
  }
  .field-row{ display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap; }
  .field{ flex:1; min-width:140px; display:flex; flex-direction:column; gap:6px; }
  label{ font-size:12px; font-weight:600; color: var(--ink-soft); }
  input{
    font-family: var(--font-body); font-size:14px; padding:10px 12px; border-radius:10px;
    border:1.5px solid var(--line); background:#FCFDFF; color:var(--ink); width:100%;
  }
  input:focus{ outline:none; border-color:var(--teal); box-shadow:0 0 0 3px var(--teal-wash); }
  .btn{
    font-family: var(--font-body); font-weight:600; font-size:14px; padding:11px 16px;
    border-radius:10px; border:none; cursor:pointer; background: var(--teal); color:white;
  }
  .btn:hover{ background: var(--navy); }
  .btn:disabled{ opacity:0.6; cursor:not-allowed; }
  .status-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; flex-wrap:wrap; gap:8px; }
  .live-dot{ display:inline-flex; align-items:center; gap:6px; font-size:11px; color: var(--ink-soft); }
  .live-dot .dot{ width:7px; height:7px; border-radius:50%; background:var(--teal); animation: pulse 1.6s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:0.3;} }
  table{ width:100%; border-collapse:collapse; font-size:13px; }
  th, td{ border:1px solid var(--line); padding:9px 10px; text-align:left; }
  thead th{
    background: var(--navy-wash); color: var(--navy); font-family: var(--font-display);
    font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:0.03em;
  }
  td.num{ font-family: var(--font-mono); font-weight:600; white-space:nowrap; }
  td.km{ color: var(--teal); }
  td.forfait{ color: var(--coral); }
  tr.total td{ background: var(--navy); color:white; font-weight:700; }
  tr.salarie-row{ cursor:pointer; }
  tr.salarie-row:hover td{ background: var(--teal-wash); }
  tr.salarie-row td:first-child{ display:flex; align-items:center; gap:6px; }
  tr.salarie-row .chevron{ display:inline-block; transition: transform 0.15s; font-size:11px; color: var(--ink-soft); }
  tr.salarie-row.open .chevron{ transform: rotate(90deg); }
  tr.detail-row td{ padding:0; border-top:none; }
  .detail-wrap{ padding:10px 14px 14px; background:#FAFBFF; }
  table.detail-table{ width:100%; border-collapse:collapse; font-size:12px; margin-top:6px; }
  table.detail-table th, table.detail-table td{ border:1px solid var(--line); padding:6px 8px; text-align:left; }
  table.detail-table thead th{ background: var(--navy-wash); color:var(--navy); font-size:10.5px; text-transform:uppercase; }
  table.detail-table td.cell-total{ background: var(--teal-wash); font-family: var(--font-mono); font-weight:700; color:var(--navy); }
  table.detail-table td.cell-forfait{ background: var(--coral-wash); font-family: var(--font-mono); font-weight:700; color:var(--coral); }
  .detail-loading{ font-size:12px; color: var(--ink-soft); padding:8px 0; }
  .empty{ text-align:center; padding:24px; color: var(--ink-soft); font-size:13.5px; }
  .error-box{ background: var(--coral-wash); color:#8a3220; border-radius:10px; padding:10px 14px; font-size:13px; margin-bottom:12px; }
  .login-card{ max-width:360px; margin:60px auto 0; }
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <h1>Vue direction</h1>
    <p>Suivi en direct des frais kilométriques déclarés par les salariés.</p>
  </div>

  <div id="login-view" class="card login-card">
    <div class="field-row">
      <div class="field">
        <label for="email">Adresse email</label>
        <input type="email" id="email" placeholder="prenom.nom@aidaux.fr">
      </div>
    </div>
    <div class="field-row" style="margin-top:10px;">
      <div class="field">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="••••••••">
      </div>
    </div>
    <div id="login-error" class="error-box" style="display:none; margin-top:10px;"></div>
    <button class="btn" id="btn-login" style="width:100%; margin-top:12px;">Se connecter</button>
    <div style="text-align:center; margin-top:12px; font-size:13px;">
      <a href="/reset.html" style="color:var(--navy); text-decoration:none;">Mot de passe oublié / première connexion</a>
    </div>
  </div>

  <div id="dashboard-view" class="card" style="display:none;">
    <div class="status-row">
      <div class="field" style="max-width:180px;">
        <label for="mois">Mois</label>
        <input type="month" id="mois">
      </div>
      <div class="live-dot"><span class="dot"></span> Actualisation automatique</div>
    </div>
    <div id="dash-error" class="error-box" style="display:none;"></div>
    <div id="table-wrap"></div>
    <div id="empty" class="empty" style="display:none;">Aucun trajet déclaré pour ce mois pour l'instant.</div>
  </div>
</div>

<script>
(function(){
  const $ = (id) => document.getElementById(id);
  const els = {
    loginView: $('login-view'), dashboardView: $('dashboard-view'),
    email: $('email'), password: $('password'), btnLogin: $('btn-login'), loginError: $('login-error'),
    mois: $('mois'), dashError: $('dash-error'), tableWrap: $('table-wrap'), empty: $('empty'),
  };

  let currentToken = '';
  let pollTimer = null;
  let expandedSalarie = null;
  let lastList = [];
  const SESSION_KEY = 'fraisKm:sessionToken';

  function todayMonth(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }

  function fmtKm(n){ return (Math.round(n*10)/10).toString().replace('.', ',') + ' km'; }
  function fmtEuro(n){ return (Math.round(n*100)/100).toString().replace('.', ',') + ' €'; }
  function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str || ''; return d.innerHTML; }
  function calcForfait(km){
    if(km <= 20.99) return 2;
    if(km <= 40.99) return 4;
    return 6;
  }

  async function fetchSalaries(){
    const mois = els.mois.value || todayMonth();
    try{
      const res = await fetch('/api/salaries?mois=' + encodeURIComponent(mois) + '&token=' + encodeURIComponent(currentToken));
      if(res.status === 401){
        stopPolling();
        sessionStorage.removeItem(SESSION_KEY);
        els.dashboardView.style.display = 'none';
        els.loginView.style.display = 'block';
        els.loginError.style.display = 'block';
        els.loginError.textContent = 'Session expirée, merci de te reconnecter.';
        return;
      }
      const data = await res.json();
      if(!res.ok){
        els.dashError.style.display = 'block';
        els.dashError.textContent = data.error || 'Erreur de chargement';
        return;
      }
      els.dashError.style.display = 'none';
      lastList = data;
      render(data);
      if(expandedSalarie){
        loadDetail(expandedSalarie);
      }
    }catch(e){
      els.dashError.style.display = 'block';
      els.dashError.textContent = 'Connexion impossible, nouvelle tentative dans 10s...';
    }
  }

  function render(list){
    if(list.length === 0){
      els.tableWrap.innerHTML = '';
      els.empty.style.display = 'block';
      return;
    }
    els.empty.style.display = 'none';
    let totalKm = 0, totalForfait = 0;
    const rows = list.map(item => {
      totalKm += item.km;
      totalForfait += item.forfait;
      const isOpen = expandedSalarie === item.salarie;
      let html = `<tr class="salarie-row${isOpen ? ' open' : ''}" data-salarie="${escapeHtml(item.salarie)}">
        <td><span class="chevron">▶</span> ${escapeHtml(item.salarie)}</td>
        <td class="num">${item.jours}</td>
        <td class="num km">${fmtKm(item.km)}</td>
        <td class="num forfait">${fmtEuro(item.forfait)}</td>
      </tr>`;
      if(isOpen){
        html += `<tr class="detail-row"><td colspan="4"><div class="detail-wrap" id="detail-wrap"><div class="detail-loading">Chargement du détail...</div></div></td></tr>`;
      }
      return html;
    }).join('');
    els.tableWrap.innerHTML = `
      <table>
        <thead><tr><th>Salarié</th><th>Jours</th><th>Km</th><th>Forfait</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr class="total"><td>Total</td><td></td><td class="num">${fmtKm(totalKm)}</td><td class="num">${fmtEuro(totalForfait)}</td></tr></tfoot>
      </table>
    `;
    els.tableWrap.querySelectorAll('tr.salarie-row').forEach(tr => {
      tr.addEventListener('click', () => {
        const salarie = tr.getAttribute('data-salarie');
        expandedSalarie = (expandedSalarie === salarie) ? null : salarie;
        render(lastList);
        if(expandedSalarie) loadDetail(expandedSalarie);
      });
    });
  }

  async function loadDetail(salarie){
    const mois = els.mois.value || todayMonth();
    const wrap = document.getElementById('detail-wrap');
    try{
      const res = await fetch('/api/trajets?salarie=' + encodeURIComponent(salarie) + '&mois=' + encodeURIComponent(mois));
      const entries = await res.json();
      if(!res.ok) throw new Error('Erreur de chargement du détail');
      renderDetail(entries, wrap);
    }catch(e){
      if(wrap) wrap.innerHTML = '<div class="detail-loading">Détail indisponible.</div>';
    }
  }

  function renderDetail(entries, wrap){
    if(!wrap) return;
    if(entries.length === 0){
      wrap.innerHTML = '<div class="detail-loading">Aucun trajet enregistré pour ce mois.</div>';
      return;
    }
    const byDate = {};
    entries.forEach(e => { if(!byDate[e.date]) byDate[e.date] = []; byDate[e.date].push(e); });
    const dates = Object.keys(byDate).sort();
    let rowsHtml = '';
    dates.forEach(date => {
      const legs = byDate[date];
      const dayKm = legs.reduce((s,l)=> s + Number(l.km||0), 0);
      const dayForfait = calcForfait(dayKm);
      const dateLabel = new Date(date + 'T00:00:00').toLocaleDateString('fr-FR', { day:'2-digit', month:'2-digit', year:'numeric' });
      legs.forEach((leg, i) => {
        rowsHtml += '<tr>';
        if(i === 0) rowsHtml += `<td rowspan="${legs.length}">${dateLabel}</td>`;
        rowsHtml += `<td>${escapeHtml(leg.depart)}</td><td>${escapeHtml(leg.arrivee)}</td><td>${fmtKm(Number(leg.km||0))}</td>`;
        if(i === 0){
          rowsHtml += `<td class="cell-total" rowspan="${legs.length}">${fmtKm(dayKm)}</td>`;
          rowsHtml += `<td class="cell-forfait" rowspan="${legs.length}">${dayForfait} €</td>`;
        }
        rowsHtml += '</tr>';
      });
    });
    wrap.innerHTML = `
      <table class="detail-table">
        <thead><tr><th>Date</th><th>Départ</th><th>Arrivée</th><th>Km</th><th>Total jour</th><th>Forfait jour</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    `;
  }

  function startPolling(){
    stopPolling();
    fetchSalaries();
    pollTimer = setInterval(fetchSalaries, 10000);
  }
  function stopPolling(){
    if(pollTimer){ clearInterval(pollTimer); pollTimer = null; }
  }

  async function tryLogin(email, password, tokenDejaValide){
    els.loginError.style.display = 'none';
    let token = tokenDejaValide;
    if(!token){
      let data;
      try{
        const res = await fetch('/api/auth/login', {
          method: 'POST', headers: {'Content-Type':'application/json'},
          body: JSON.stringify({ email, password })
        });
        data = await res.json().catch(()=>({}));
        if(!res.ok){
          els.loginError.style.display = 'block';
          els.loginError.textContent = data.error || 'Erreur de connexion.';
          return;
        }
      }catch(e){
        els.loginError.style.display = 'block';
        els.loginError.textContent = 'Erreur de connexion.';
        return;
      }
      token = data.token;
    }
    currentToken = token;
    const mois = els.mois.value || todayMonth();
    const res = await fetch('/api/salaries?mois=' + encodeURIComponent(mois) + '&token=' + encodeURIComponent(token));
    if(res.status === 401){
      sessionStorage.removeItem(SESSION_KEY);
      els.loginError.style.display = 'block';
      els.loginError.textContent = 'Session expirée, merci de vous reconnecter.';
      return;
    }
    const data = await res.json().catch(()=>null);
    if(!res.ok){
      els.loginError.style.display = 'block';
      els.loginError.textContent = (data && data.error) || 'Erreur de connexion.';
      return;
    }
    sessionStorage.setItem(SESSION_KEY, token);
    els.loginView.style.display = 'none';
    els.dashboardView.style.display = 'block';
    lastList = data;
    render(data);
    startPolling();
  }

  els.btnLogin.addEventListener('click', () => {
    const email = els.email.value.trim();
    const pwd = els.password.value.trim();
    if(!email || !pwd) return;
    tryLogin(email, pwd, null);
  });
  els.password.addEventListener('keydown', (e) => {
    if(e.key === 'Enter') els.btnLogin.click();
  });
  els.mois.addEventListener('change', fetchSalaries);

  (function init(){
    if(!els.mois.value) els.mois.value = todayMonth();
    const saved = sessionStorage.getItem(SESSION_KEY);
    if(saved) tryLogin(null, null, saved);
  })();
})();
</script>
</body>
</html>
